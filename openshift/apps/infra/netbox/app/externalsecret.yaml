---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netbox-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # App
        db_password: "{{ .POSTGRES_PASS }}"
        superuser_password: "{{ .password }}"
        superuser_api_token: "{{ .API_KEY }}"
        secret_key: "{{ .SECRET_KEY }}"
        # Stable, domain-separated pepper for NetBox v2 API tokens.
        api_token_peppers: '{{ dict "1" (printf "netbox-api-token-pepper:%s" .SECRET_KEY | sha256sum) | toJson }}'
        username: nick.a@redhat.com
        email: nick.a@redhat.com
        password: "{{ .password }}"
        api_token: "{{ .API_KEY }}"
        storage.yaml: |
          STORAGES:
            default:
              BACKEND: storages.backends.s3.S3Storage
              OPTIONS:
                access_key: {{ .S3_ACCESS_KEY | toJson }}
                secret_key: {{ .S3_SECRET_KEY | toJson }}
                bucket_name: ocp-neptune-netbox
                endpoint_url: {{ .S3_ENDPOINT_URL | toJson }}
                region_name: us-west-1
        email_password: ""
        napalm_password: ""
        redis_tasks_password: ""
        redis_cache_password: ""

        NETBOX_POSTGRES_HOST: postgres-pooler-rw.database.svc.cluster.local
        NETBOX_POSTGRES_PORT: "5432"
        NETBOX_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        NETBOX_POSTGRES_DB: netbox
        DB_DISABLE_SERVER_SIDE_CURSORS: "true"
        SECRET_S3_ACCESS_KEY: "{{ .S3_ACCESS_KEY }}"
        SECRET_S3_SECRET_KEY: "{{ .S3_SECRET_KEY }}"
        AWS_S3_ENDPOINT_URL: "{{ .S3_ENDPOINT_URL }}"
        SECRET_DOMAIN: "${SECRET_DOMAIN}"
  dataFrom:
    - extract:
        key: netbox
