---
# Database migrations require restoring the pre-upgrade database for rollback.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
spec:
  interval: 30m
  chart:
    spec:
      chart: netbox
      version: 8.3.92
      sourceRef:
        kind: HelmRepository
        name: netbox-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0
  values:
    fullnameOverride: netbox
    image:
      registry: docker.io
      repository: netboxcommunity/netbox
      tag: v4.7.3-5.1.1
      digest: sha256:1d6e0b5fbd48da9868376900561ee55992e04446ce7861dab5e9a42ae01f3fcb
    existingSecret: netbox-secret
    superuser:
      name: nick.a@redhat.com
      email: nick.a@redhat.com
      existingSecret: netbox-secret
    podSecurityContext:
      enabled: true
    securityContext:
      enabled: true
      runAsNonRoot: true
      privileged: false
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    admins:
      - - Nick Arellano
        - nick.a@redhat.com
    loginRequired: false
    logging:
      disable_existing_loggers: false
      handlers:
        console:
          class: logging.StreamHandler
      loggers:
        netbox.authentication.*:
          handlers:
            - console
          level: DEBUG
      version: 1
    email:
      existingSecretName: netbox-secret
      existingSecretKey: email_password
    extraConfig:
      - secret:
          secretName: netbox-storage
          items:
            - key: storage.yaml
              path: storage.yaml
    metrics:
      enabled: true
    postgresql:
      enabled: false
    valkey:
      enabled: false
    tasksDatabase:
      host: dragonfly.database.svc.cluster.local
      port: 6379
      database: 0
      existingSecretName: netbox-secret
      existingSecretKey: redis_tasks_password
    cachingDatabase:
      host: dragonfly.database.svc.cluster.local
      port: 6379
      database: 1
      existingSecretName: netbox-secret
      existingSecretKey: redis_cache_password
    externalDatabase:
      host: postgres-pooler-rw.database.svc.cluster.local
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-secret
      existingSecretKey: db_password
      disableServerSideCursors: true
    persistence:
      enabled: false
    reportsPersistence:
      enabled: false
    scriptsPersistence:
      enabled: false
    housekeeping:
      enabled: false
    init:
      image:
        repository: library/busybox
        tag: 1.38.0
      securityContext:
        enabled: true
    worker:
      enabled: true
      podSecurityContext:
        enabled: true
      securityContext:
        enabled: true
        runAsNonRoot: true
        privileged: false
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 250Mi
        limits:
          memory: 2000Mi
      waitForBackend:
        containerSecurityContext:
          enabled: true
      updateStrategy:
        type: Recreate
    resources:
      requests:
        cpu: 10m
        memory: 250Mi
      limits:
        memory: 2000Mi
    updateStrategy:
      type: Recreate
    commonAnnotations:
      reloader.stakater.com/auto: 'true'
    global:
      compatibility:
        openshift:
          adaptSecurityContext: force
  timeout: 15m
