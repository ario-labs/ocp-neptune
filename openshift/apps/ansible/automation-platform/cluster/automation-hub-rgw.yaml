---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: automation-hub-rgw
spec:
  bucketName: automation-hub-neptune
  storageClassName: ocs-storagecluster-ceph-rgw
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: automation-hub-rgw-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: automation-hub-rgw-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: automation-hub-rgw-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: automation-hub-rgw-reader
subjects:
  - kind: ServiceAccount
    name: automation-hub-rgw-reader
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: automation-hub-rgw
spec:
  provider:
    kubernetes:
      remoteNamespace: ansible
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: automation-hub-rgw-reader
